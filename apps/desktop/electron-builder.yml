appId: com.rasalilabs.ralion
productName: Ralion
copyright: Copyright © 2026 Ras Ali Labs

directories:
  output: dist-installer
  buildResources: assets

files:
  - dist/**/*
  - node_modules/**/*
  - package.json

# ── Windows ──────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: assets/icon.ico
  publisherName: Ras Ali Labs
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ralion

# ── macOS ─────────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icon.icns
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist

dmg:
  title: Ralion ${version}
  icon: assets/icon.icns
  background: assets/dmg-background.png
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 200
    - x: 400
      y: 200
      type: link
      path: /Applications

# ── Linux ─────────────────────────────────────────────────────────────────────
linux:
  target:
    - AppImage
    - deb
    - rpm
  icon: assets/icon.png
  category: Office
  maintainer: Ras Ali Labs <support@rasalilabs.com>

# ── Auto Update ───────────────────────────────────────────────────────────────
publish:
  provider: generic
  url: https://ralion.rasalilabs.com/api/version/releases

# ── TypeScript ────────────────────────────────────────────────────────────────
extraMetadata:
  main: dist/main.js
