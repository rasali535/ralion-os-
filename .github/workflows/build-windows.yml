name: Build Windows Desktop Application

on:
  push:
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - 'electron-builder.yml'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Ralion Windows x64 Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Desktop TypeScript
        run: npm run desktop:build

      - name: Package Windows NSIS Installer (x64)
        run: npm run desktop:dist:win

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ralion-Windows-Installer
          path: apps/desktop/dist-installer/*.exe
          if-no-files-found: error
