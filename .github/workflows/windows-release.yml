name: Production Windows Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows-release:
    name: Build & Validate Genuine Windows PE Executable Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Desktop Application Code
        run: npm run desktop:build

      - name: Package Electron Windows NSIS Installer (x64)
        run: npm run desktop:dist:win

      - name: Validate Genuine PE Binary Executable
        run: node apps/desktop/scripts/validate-installer.js

      - name: Generate Website Release Metadata (release.json)
        run: node apps/desktop/scripts/generate-release-json.js

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ralion-Windows-Release-v2.4.2
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/release.json
          if-no-files-found: error
